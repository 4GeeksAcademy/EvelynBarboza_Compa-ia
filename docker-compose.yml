services:
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile

    ports:
      - "3000:3000"
      - "3001:3001"

    env_file:
      - .env

    volumes:
      - ./uis:/app
      - website_node_modules:/app/application/node_modules
      #- website_node_modules:/app/website/node_modules el del profe lo cambie por el de arriba
      - backoffice_node_modules:/app/backoffice/node_modules

    command: ["sh", "/app/start.sh"]

    depends_on:
      - backend

    networks:
      - company_network

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./services:/app

    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

    networks:
      - company_network

networks:
  company_network:
    name: company_network
    driver: bridge

volumes:
  website_node_modules:
  backoffice_node_modules:
