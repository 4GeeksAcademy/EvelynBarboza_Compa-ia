[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow API project"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "tinydb",
  "uvicorn[standard]",
  "python-multipart",
]

[project.scripts]
seed = "services.api.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]