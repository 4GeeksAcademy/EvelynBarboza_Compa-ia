[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow API project"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "tinydb",
  "uvicorn[standard]",
  "python-multipart",
]

[project.scripts]
seed = "services.api.seed:main"

[dependency-groups]
test = [
  "fastapi>=0.141.1",
  "httpx>=0.27.0",
  "libpass[bcrypt]>=1.9.3",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "python-dotenv>=1.2.3",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "tinydb>=4.9.0",
]

[tool.pytest.ini_options]
testpaths = ["services-aut/api/tests"]

[tool.uv]
default-groups = ["test"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]